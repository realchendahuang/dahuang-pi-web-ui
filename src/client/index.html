<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pi Studio</title>
    <meta name="theme-color" content="#161615" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        --pi-control-font-size: 16px;
        --pi-font-sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --pi-font-mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
        --pi-control-font-family: var(--pi-font-sans);
        --pi-control-monospace-font-family: var(--pi-font-mono);
        --pi-radius-xs: 6px;
        --pi-radius-sm: 8px;
        --pi-radius-md: 10px;
        --pi-radius-lg: 12px;
        --pi-bg: #161615;
        --pi-surface: #1d1d1b;
        --pi-surface-secondary: #252523;
        --pi-surface-hover: #2a2a28;
        --pi-terminal-bg: #121211;
        --pi-terminal-text: #f2f2ef;
        --pi-border: rgba(255, 255, 255, 0.09);
        --pi-border-strong: rgba(255, 255, 255, 0.16);
        --pi-border-muted: rgba(255, 255, 255, 0.06);
        --pi-text: #f2f2ef;
        --pi-text-secondary: #aaa9a3;
        --pi-text-bright: #ffffff;
        --pi-muted: #777770;
        --pi-dim: #5c5c56;
        --pi-accent: #8fb8dd;
        --pi-accent-border: #5f87a8;
        --pi-selection-bg: #2e2e2a;
        --pi-success: #57ab5a;
        --pi-success-border: #3d7a40;
        --pi-success-bg: #18201a;
        --pi-success-surface: #1c2a20;
        --pi-success-ring: #57ab5a55;
        --pi-warning: #c09a3e;
        --pi-warning-border: #8a6f2a;
        --pi-warning-surface: #221e14;
        --pi-danger: #d9766c;
        --pi-purple: #b3a1d9;
        --pi-purple-border: #7f6aab;
        --pi-purple-surface: #232030;
        --pi-overlay: #0008;
        --pi-shadow-soft: #0006;
        --pi-shadow: #0008;
        --pi-shadow-strong: #000b;
        --pi-bg-overlay-soft: #161615dd;
        --pi-bg-overlay: #161615e6;
        --pi-success-bg-overlay: #18201aee;
        --pi-terminal-selection: #3a4a5c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --pi-bg: #f7f7f5;
          --pi-surface: #ffffff;
          --pi-surface-secondary: #f1f1ee;
          --pi-surface-hover: #ececea;
          --pi-border: rgba(0, 0, 0, 0.09);
          --pi-border-strong: rgba(0, 0, 0, 0.16);
          --pi-border-muted: rgba(0, 0, 0, 0.06);
          --pi-text: #181817;
          --pi-text-secondary: #696965;
          --pi-text-bright: #000000;
          --pi-muted: #989891;
          --pi-dim: #b0b0a9;
          --pi-accent: #3f6d96;
          --pi-accent-border: #3f6d96;
          --pi-selection-bg: #e8e8e3;
          --pi-success: #2e7d32;
          --pi-success-border: #2e7d32;
          --pi-success-bg: #e6f2e7;
          --pi-success-surface: #dcefe0;
          --pi-success-ring: #2e7d3255;
          --pi-warning: #8a6d1d;
          --pi-warning-border: #8a6d1d;
          --pi-warning-surface: #faf3dd;
          --pi-danger: #c2453c;
          --pi-purple: #6b5b95;
          --pi-purple-border: #6b5b95;
          --pi-purple-surface: #ece8f4;
          --pi-overlay: #18181766;
          --pi-shadow-soft: #18181714;
          --pi-shadow: #18181722;
          --pi-shadow-strong: #18181733;
          --pi-bg-overlay-soft: #f7f7f5dd;
          --pi-bg-overlay: #f7f7f5e6;
          --pi-success-bg-overlay: #e6f2e7ee;
          --pi-terminal-selection: #264f78;
        }
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
