              - generic [ref=f1e70]: "# Pi Web UI 重构开发任务书 我想开发一个面向 Pi Coding Agent 的高质量 Web 客户端。 产品体验参考 Codex App、Harnss 这类现代 Coding Agent 客户端，但不要复制它们的品牌、Logo、图标或具体视觉资产。重点学习它们的信息架构、交互方式、留白、层级和工作流。 请直接执行开发，不要只输出规划文档。 --- # 一、最终技术方案 ## 1. 开源底座 基于以下项目进行二次开发： `https://github.com/jmfederico/pi-web` 不要从零搭建 Pi 的运行时和通信层。 保留原项目已有的： * Pi Session Daemon * 持久化会话 * Project 管理 * Workspace 管理 * Git Worktree * WebSocket 实时通信 * 文件浏览 * 集成终端 * CodeMirror * xterm.js * 远程机器能力 * Pi Package 管理 * Session 恢复 * 模型与上下文状态 * 现有服务安装和启动方式 主要工作是重新设计前端界面、组件结构和用户交互。 ## 2. 视觉参考 主要参考： `https://github.com/OpenSource03/harnss` 参考 Codex App 的整体体验： * 简洁 * 克制 * 专业 * 高信息密度但不拥挤 * 大量使用留白和细边框 * 重要操作突出 * 次要信息默认收起 * 对话是产品中心 * 文件、终端、Diff 等工具围绕当前任务动态出现 不要直接复制 OpenAI 或 Harnss 的品牌视觉。 ## 3. 暂时不要做的事情 第一版不要： * 重写 Pi 后端 * 把 Lit 全部迁移到 React * 引入数据库 * 开发账号系统 * 开发多人协作 * 开发云端同步 * 开发计费系统 * 开发插件市场 * 开发复杂权限系统 * 做移动端原生 App * 为了“架构优雅”大规模重写稳定代码 第一版定位是： > 一个本地优先、单用户、面向开发者的现代 Pi Coding Agent Web 客户端。 --- # 二、产品结构 整个产品采用三栏布局。 ```text ┌──────────────────┬──────────────────────────────────┬────────────────────┐ │ 左侧导航栏 │ 中央 Agent 对话区 │ 右侧工作面板 │ │ │ │ │ │ 项目 │ 当前任务标题 │ Changes │ │ 工作区 │ 对话内容 │ Files │ │ 会话列表 │ 思考过程 │ Terminal │ │ │ Tool Call │ Git │ │ │ Diff │ Context │ │ │ │ │ ├──────────────────┴──────────────────────────────────┴────────────────────┤ │ 输入框 / 文件附件 / 模型 / Thinking Level / 权限模式 / 发送 │ └─────────────────────────────────────────────────────────────────────────┘ ``` ## 核心原则 中央对话区域始终是视觉中心。 左右面板可以收起。 不要把所有功能同时堆在页面上。 右侧工作面板根据当前行为自动切换： * Agent 修改文件时，显示 Changes * Agent 执行命令时，显示 Terminal * 用户点击文件时，显示 Files * 用户查看 Git 状态时，显示 Git * 普通对话时，右侧面板可以自动收起 * 用户手动打开面板后，不要强制自动关闭 --- # 三、页面详细设计 ## 1. 左侧导航栏 左侧栏宽度约为 260px，支持收起到 56px。 从上到下包含： ### 顶部区域 * 产品 Logo * 产品名称，暂定为 Pi Studio * 新建任务按钮 * 收起侧栏按钮 ### 项目选择 展示当前 Project 和 Workspace。 支持： * 切换项目 * 切换 Workspace * 创建 Workspace * 显示当前 Git Branch * 显示工作区是否存在未提交修改 项目名称不要占据太大空间。 ### 会话列表 按照时间分组： * Today * Yesterday * Previous 7 days * Older 每个会话展示： * 会话标题 * 当前状态 * 最后更新时间 * 是否正在运行 * 是否等待用户确认 * 是否出现错误 支持： * 搜索会话 * 新建会话 * 重命名 * 收藏 * 删除 * 右键菜单 * 会话运行状态实时更新 状态尽量使用小圆点和简短文字，不要使用大面积彩色标签。 ### 底部区域 包含： * Settings * 当前机器 * Pi 连接状态 * 深色或浅色主题 * 版本信息 --- ## 2. 中央对话区 中央区域最大宽度控制在约 900px 到 1040px。 不要让内容无限撑满大屏幕。 ### 顶部标题栏 包含： * 当前 Session 标题 * Project 名称 * Workspace 和 Branch * Agent 状态 * 更多操作 * 打开右侧面板按钮 标题栏保持轻量，不要做成复杂仪表盘。 ### 消息样式 用户消息： * 靠右或使用轻微背景块 * 最大宽度约为 75% * 支持编辑和重新提交 * 支持复制 * 支持显示图片或文件附件 Agent 消息： * 靠左 * 不需要大面积聊天气泡 * 使用自然文档流 * Markdown 排版清楚 * 代码块支持复制 * 长代码支持折叠 * 表格支持横向滚动 * 标题、列表、引用层级清晰 整体更像开发工作记录，不要像普通客服聊天软件。 ### 思考过程 Thinking 默认收起。 收起状态展示： * Thinking * 消耗时间 * 当前是否仍在思考 展开后显示完整内容。 视觉上弱化，不要和最终回复抢夺注意力。 ### 运行状态 Agent 正在工作时，在对话底部展示清楚的实时状态，例如： * Reading files * Searching code * Editing `src/app.ts` * Running tests * Waiting for command * Compacting context * Retrying request 不要只展示一个没有信息的旋转图标。 --- ## 3. Tool Call 组件 所有工具调用统一使用 Tool Card 组件。 Tool Card 包含： * 工具图标 * 工具名称 * 简短操作描述 * 运行状态 * 耗时 * 展开或收起按钮 状态包括： * Pending * Running * Success * Failed * Cancelled * Waiting for approval 不同工具需要有不同展示方式。 ### Read 收起状态： ```text Read src/components/chat.ts ``` 展开后显示： * 文件路径 * 读取范围 * 必要的内容预览 ### Search、Grep、Find 收起状态： ```text Searched for “AgentSession” · 12 results ``` 展开后显示匹配结果。 ### Bash 收起状态： ```text Ran npm test · Passed ``` 展开后显示终端输出。 需要： * 等宽字体 * ANSI 输出支持 * 自动滚动 * 最大高度 * 长输出折叠 * 复制命令 * 复制输出 ### Edit、Write 收起状态： ```text Edited src/app.ts · +24 −8 ``` 展开后显示 Diff。 Diff 使用： * 文件名 * 新增和删除行数 * Unified 或 Split 模式切换 * 语法高亮 * 展开完整文件 * 点击后同步打开右侧 Changes 面板 ### Tool Error 错误信息必须可读。 不要直接展示未经处理的大段 JSON。 显示： * 出错工具 * 简短错误原因 * 原始错误详情 * 重试入口 --- # 四、底部输入区 输入区固定在中央区域底部，但不要覆盖内容。 使用圆角矩形容器。 包含： * 多行文本框 * 文件附件 * 图片附件 * `@` 文件选择 * `/` 命令选择 * 模型选择 * Thinking Level * 权限模式 * 发送按钮 * Agent 运行时的停止按钮 ## 输入交互 * Enter 发送 * Shift + Enter 换行 * 支持拖入文件 * 支持粘贴图片 * 支持粘贴长文本 * 文本框自动增高，但设置最大高度 * 发送后保留合理的焦点行为 * Agent 运行时可以发送 Steer * Agent 运行时可以添加 Follow-up * 清楚区分“立即纠正”和“完成后继续” ## 权限模式 暂定三个模式： * Ask First * Accept Edits * Allow All 权限模式必须明显，但不要占据过多空间。 危险操作需要二次确认。 --- # 五、右侧工作面板 右侧面板默认宽度约 360px 到 480px，可调整大小。 支持以下标签。 ## 1. Changes 展示当前 Session 产生的文件修改。 包含： * 修改文件列表 * 新增和删除行数 * Diff * 打开文件 * 恢复单个文件 * 恢复全部修改 * Stage * Unstage 破坏性操作必须确认。 ## 2. Files 包含： * 文件树 * 文件搜索 * 文件内容查看 * CodeMirror * 当前打开文件标签 * 复制路径 * 将文件添加到输入上下文 第一版不需要把它做成完整 IDE。 重点是查看和引用文件。 ## 3. Terminal 保留现有 xterm.js 和 node-pty 能力。 支持： * 多终端标签 * 新建终端 * 关闭终端 * 自动调整尺寸 * 清屏 * 复制 * 粘贴 * 当前目录展示 ## 4. Git 展示： * 当前 Branch * Modified files * Staged files * Untracked files * Commit message 输入 * Commit * Push 第一版不需要做复杂 Git 图形客户端。 ## 5. Context 展示： * 当前模型 * Provider * Thinking Level * Context 已使用比例 * Token 使用量 * 本次 Session 成本 * Compaction 状态 * 已加载的 Skills * 已加载的 Context 文件 * 当前工具列表 不要做成复杂的数据仪表盘。 --- # 六、视觉设计规范 ## 风格关键词 * Codex-like * Calm * Minimal * Professional * Native desktop feeling * High information density * Clear hierarchy * Subtle borders * Soft surfaces * Restrained color use ## 色彩 同时支持浅色和深色。 ### 浅色模式 建议： ```css --background: #f7f7f5; --surface: #ffffff; --surface-secondary: #f1f1ee; --border: rgba(0, 0, 0, 0.09); --border-strong: rgba(0, 0, 0, 0.16); --text-primary: #181817; --text-secondary: #696965; --text-tertiary: #989891; ``` ### 深色模式 建议： ```css --background: #161615; --surface: #1d1d1b; --surface-secondary: #252523; --border: rgba(255, 255, 255, 0.09); --border-strong: rgba(255, 255, 255, 0.16); --text-primary: #f2f2ef; --text-secondary: #aaa9a3; --text-tertiary: #777770; ``` 成功、警告、失败颜色只用于状态和反馈。 禁止大面积使用高饱和品牌色。 ## 圆角 * 小组件：6px * 按钮：8px * 卡片：10px * 输入框：12px 不要让所有组件都使用过大的圆角。 ## 阴影 尽量少用阴影。 主要通过： * 背景层级 * 细边框 * 留白 * 字号 * 字重 区分组件。 ## 字体 默认使用系统字体： ```css font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif; ``` 代码使用： ```css font-family: \"SFMono-Regular\", \"Cascadia Code\", \"Roboto Mono\", monospace; ``` ## 图标 统一使用一套线性图标。 建议 Lucide 风格。 不要混用多个图标库。 --- # 七、响应式布局 第一版主要针对桌面浏览器，但需要支持基本移动端。 ## 桌面端 宽度大于 1200px： * 三栏布局 * 左右栏均可见 * 中央区域保持最大宽度 ## 平板端 宽度 768px 到 1200px： * 左侧栏可收起 * 右侧栏使用抽屉 * 中央对话区优先 ## 手机端 宽度小于 768px： * 默认只展示对话 * 项目和会话使用左侧抽屉 * Files、Changes、Terminal 使用底部或全屏面板 * 输入区保持可用 * 不要求实现完整 IDE 体验 --- # 八、代码架构要求 ## 1. 不破坏原有数据层 先识别现有： * Server API * WebSocket 消息 * Session Store * Project Store * Workspace Store * Terminal Store * File API * Git API 在这些能力上增加新的 UI 适配层。 不要让页面组件直接拼接和解析底层 WebSocket 数据。 ## 2. 建立前端领域模型 建议整理成： ```text src/ client/ api/ stores/ models/ adapters/ components/ app-shell/ sidebar/ conversation/ composer/ tool-cards/ workbench/ common/ styles/ tokens.css themes.css typography.css layout.css ``` 具体路径根据现有项目结构调整，不要为了匹配这份目录强行搬迁所有代码。 ## 3. 统一 Tool Call 数据 增加标准化显示模型： ```ts type ToolCardStatus = | \"pending\" | \"running\" | \"success\" | \"failed\" | \"cancelled\" | \"approval-required\"; interface ToolCardViewModel { id: string; toolName: string; title: string; summary?: string; status: ToolCardStatus; startedAt?: number; endedAt?: number; duration?: number; input?: unknown; output?: unknown; error?: string; filePath?: string; diff?: { additions: number; deletions: number; content: string; }; } ``` 通过 Adapter 把 Pi 的不同 Tool Event 转换成 UI 组件需要的数据。 ## 4. 设计令牌 所有颜色、间距、圆角、边框、字体和尺寸统一使用 CSS Variables。 不要在大量组件中写死颜色值。 ## 5. 状态管理 优先复用现有状态管理方式。 不要为了重构 UI 随意引入重量级状态库。 只有确定现有方案无法维护时，才增加新的状态管理依赖。 --- # 九、实施顺序 请按照以下顺序实施。 ## 阶段 0：分析现有项目 先完成： 1. 阅读 `AGENTS.md` 2. 阅读 README 和开发文档 3. 运行项目 4. 运行现有测试 5. 截取现有主要页面 6. 画出现有前后端数据流 7. 找出不能破坏的接口 8. 列出可直接复用的组件 9. 建立新的 Git Branch 输出一份简短的 `docs/ui-rebuild-plan.md`。 完成分析后直接继续开发，不要等待确认。 ## 阶段 1：设计系统和 App Shell 完成： * Design Tokens * 浅色和深色主题 * 三栏布局 * 可折叠左侧栏 * 可折叠右侧面板 * 顶部标题栏 * 基础按钮、菜单、Tooltip、Dialog、Dropdown * 全局字体和间距 此阶段先使用现有数据。 不要优先修改业务逻辑。 ## 阶段 2：左侧导航和会话系统 完成： * Project 和 Workspace 切换 * Session 分组 * 新建 Session * Session 搜索 * 运行状态 * 右键菜单 * 重命名 * 删除确认 * 空状态 * 加载状态 * 错误状态 ## 阶段 3：对话区域和输入框 完成： * 用户消息 * Agent 消息 * Markdown * Code Block * Thinking * 流式输出 * 输入框 * 附件 * 模型选择 * Thinking Level * Stop * Steer * Follow-up ## 阶段 4：Tool Card 优先实现： 1. Read 2. Bash 3. Edit 4. Write 5. Search、Grep、Find 6. 通用工具 7. 错误状态 8. 权限确认 ## 阶段 5：右侧工作面板 完成： * Changes * Files * Terminal * Git * Context 复用原项目已有能力。 ## 阶段 6：交互和细节 完成： * Keyboard Shortcuts * Command Palette * Toast * Tooltip * Loading Skeleton * Empty State * Error Boundary * 自动滚动 * 保留输入草稿 * 面板尺寸持久化 * 用户偏好持久化 ## 阶段 7：响应式与测试 完成： * 桌面端测试 * 平板端测试 * 手机端基本可用 * 深色模式 * 浅色模式 * 长对话性能 * 大量 Tool Call * 超长终端输出 * 大型 Diff * WebSocket 断线重连 * Session 恢复 * 浏览器刷新恢复 --- # 十、测试与质量要求 每个阶段完成后都要运行： ```bash npm run typecheck npm run lint npm test npm run verify ``` 根据项目当前实际脚本调整，但不能跳过现有验证流程。 增加必要的： * 组件测试 * Store 测试 * Tool Adapter 测试 * WebSocket 状态测试 * 关键页面 E2E 测试 特别验证： * 原有 Pi Session 能正常启动 * 页面关闭后 Session 继续运行 * 页面重新打开后恢复状态 * Agent 输出可以实时流式显示 * Tool Call 状态正确 * 终端可以输入和显示 * 文件修改可以查看 Diff * 项目和 Workspace 能正常切换 * 旧会话能正常打开 * 原有安装命令不被破坏 --- # 十一、验收标准 第一版完成时，必须满足以下条件。 ## 功能 * 可以添加和打开项目 * 可以选择 Workspace * 可以创建 Pi Session * 可以恢复历史 Session * 可以发送 Prompt * 可以实时看到 Agent 输出 * 可以看到 Thinking * 可以看到 Tool Call * 可以停止 Agent * 可以发送 Steer * 可以发送 Follow-up * 可以切换模型 * 可以切换 Thinking Level * 可以查看文件 * 可以查看 Diff * 可以使用终端 * 可以查看 Git 状态 * 可以切换浅色和深色主题 ## 视觉 * 页面明显摆脱传统 Dashboard 风格 * 整体接近原生桌面开发工具 * 中央对话区是视觉中心 * 不存在大量高饱和颜色 * 不存在过多卡片套卡片 * 不存在粗重边框 * 不存在大量无意义状态标签 * 信息层级清楚 * 长时间使用不疲劳 * 1440px 桌面端布局完整 * 13 英寸笔记本上仍然可用 ## 工程 * 不破坏原有后端和 Session Daemon * 不重写稳定功能 * 没有明显 TypeScript 错误 * 现有测试通过 * 新增关键测试 * 代码结构清楚 * 组件可复用 * Design Token 统一 * README 更新 * 保留 MIT License 和原作者版权声明 --- # 十二、开发方式 请遵守以下工作方式： 1. 先运行项目并理解代码，禁止直接猜测架构。 2. 每次修改前先寻找已有组件和能力。 3. 优先重构前端展示层，不轻易修改底层协议。 4. 一次完成一个可验证的垂直切片。 5. 每个阶段结束后运行测试。 6. 页面实现后使用浏览器截图检查视觉效果。 7. 主动修复溢出、错位、文本截断、深色模式和响应式问题。 8. 不要留下大量 TODO 作为“完成”。 9. 不要只制作静态 Mockup，必须连接真实 Pi 数据。 10. 遇到原项目缺陷时，先记录，再做最小范围修复。 11. 不要停在规划阶段，持续执行到第一版可运行。 12. 最终提供变更说明、运行方式、测试结果和未完成项。 --- # 十三、第一轮优先交付 不要一次性追求全部功能。 第一轮先交付一个可运行的核心版本： 1. 新的三栏 App Shell 2. 新的左侧 Session 列表 3. 新的中央对话界面 4. 新的输入框 5. Thinking 折叠 6. Read、Bash、Edit Tool Card 7. Changes 右侧面板 8. 浅色和深色主题 9. 保持真实 Pi Session 和流式通信正常 10. 通过现有测试 第一轮完成后，再继续补 Files、Terminal、Git、Context 和移动端。 现在开始检查仓库、运行项目并实施。"
